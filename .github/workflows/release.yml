name: 'Release'

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, also used as the Git tag name (example: 1.2.3)'
        type: string
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read # jobs that need more raise it themselves

env:
  VERSION: ${{ inputs.version }}

jobs:
  validate:
    name: 'Validate'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - name: 'Git Checkout'
        uses: actions/checkout@v7
      - name: 'Check Version Format'
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Invalid version::Expected format X.Y.Z, got '$VERSION'."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "::error title=Tag exists::Tag '$VERSION' already exists."
            exit 1
          fi
      - name: 'Read Release Notes'
        id: notes
        run: |
          if ! grep -Fxq "## $VERSION" CHANGELOG.md; then
            echo "::error title=No changelog::CHANGELOG.md has no '## $VERSION' section."
            exit 1
          fi
          # Lines after the version heading, up to the next version heading, without leading blank lines
          notes="$(awk -v heading="## $VERSION" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found && !started && /^[[:space:]]*$/ { next }
            found { started = 1; print }
          ' CHANGELOG.md)"
          if [[ -z "${notes//[[:space:]]/}" ]]; then
            echo "::error title=Empty changelog::CHANGELOG.md section '## $VERSION' is empty."
            exit 1
          fi
          printf '%s\n' "$notes"
          delimiter="EOF_$(openssl rand -hex 16)"
          printf 'notes<<%s\n%s\n%s\n' "$delimiter" "$notes" "$delimiter" >> "$GITHUB_OUTPUT"

  build_and_test:
    name: 'Build and Test'
    needs: validate
    uses: ./.github/workflows/build-and-test.yml
    with:
      version: ${{ inputs.version }}

  release:
    name: 'Create Release'
    needs: [validate, build_and_test]
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    permissions:
      contents: write # create the tag and the release
    steps:
      - name: 'Download binaries'
        uses: actions/download-artifact@v8
        with:
          pattern: 'walker-*'
          path: dist
          merge-multiple: true
      - name: 'Create Checksums'
        working-directory: dist
        run: |
          ls -l
          sha256sum walker-* > SHA256SUMS
      - name: 'Create GitHub Release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTES: ${{ needs.validate.outputs.notes }}
        run: |
          gh release create "$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes "$NOTES"
